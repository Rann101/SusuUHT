<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin pesanan – SusuPasar</title>
<style>
:root{--bg:#f4f8fc;--s:#fff;--ink:#12233f;--mu:#5b6b82;--ln:#dbe4ef;--br:#1d4ed8;--sun:#ffc83d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1626;--s:#15233b;--ink:#eaf1fb;--mu:#9fb0c7;--ln:#26385a;--br:#6b95ff;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
input{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--s);color:var(--ink);border-radius:8px;padding:7px 12px}
button.p{background:var(--br);color:#fff;border-color:var(--br)}
.c{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.c.n{border-color:var(--sun);box-shadow:0 0 0 2px rgba(255,200,61,.4)}
.m{color:var(--mu);font-size:14px}.r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--ln)}
.a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.e{color:#d64545;min-height:22px}
</style>
</head>
<body>
<div class="w">
  <h1>Admin pesanan SusuPasar</h1>
  <div id="login">
    <p class="m">Masuk dengan akun admin yang Anda buat di Supabase atau Firebase.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password">
    <div class="e" id="err" role="alert"></div>
    <button class="p" id="go">Masuk</button>
  </div>
  <div id="app" hidden>
    <div class="r" style="margin-bottom:10px"><span class="m" id="sum"></span><span><button id="nt">Aktifkan notifikasi</button> <button id="rf">Muat ulang</button> <button id="lo">Keluar</button></span></div>
    <div id="list"></div>
  </div>
</div>
<script src="config.js"></script>
<script>
const C=window.SP_CONFIG||{},$=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp"+Math.round(+n||0).toLocaleString("id-ID");
const STL={baru:"Baru",diproses:"Diproses",dikemas:"Dikemas",dikirim:"Dikirim",selesai:"Selesai",batal:"Dibatalkan"},NEXT={baru:"diproses",diproses:"dikemas",dikemas:"dikirim",dikirim:"selesai"};
const FS="https://firestore.googleapis.com/v1/projects/"+((C.firebase||{}).projectId||"")+"/databases/(default)/documents";
let tok=null,orders=[],tm=null,seen=null,actx=null,flash=null;const base=document.title;
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch(e){}}
function notify(list){beep();if(!document.hasFocus()){let k=0;clearInterval(flash);flash=setInterval(()=>{document.title=(k++%2)?base:"("+list.length+") Pesanan baru!"},900)}
 try{if("Notification" in window&&Notification.permission==="granted")new Notification("Pesanan baru: "+list[0].no,{body:list[0].name+" · "+rp(list[0].total)})}catch(e){}}
window.addEventListener("focus",()=>{clearInterval(flash);document.title=base});

function fv(f){const o={};for(const k in f){const v=f[k];o[k]=v.stringValue!==undefined?v.stringValue:v.integerValue!==undefined?+v.integerValue:v.timestampValue!==undefined?v.timestampValue:""}return o}
function norm(o){let it=o.items;if(typeof it==="string"){try{it=JSON.parse(it)}catch(e){it=[]}}return{...o,items:Array.isArray(it)?it:[]}}

async function login(){
  $("err").textContent="";
  const email=$("em").value.trim(),password=$("pw").value;
  try{
    if(C.backend==="supabase"){
      const r=await fetch(C.supabase.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:C.supabase.anonKey,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
      const j=await r.json();if(!r.ok||!j.access_token)throw 0;tok=j.access_token;
    }else if(C.backend==="firebase"){
      const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+C.firebase.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password,returnSecureToken:true})});
      const j=await r.json();if(!r.ok||!j.idToken)throw 0;tok=j.idToken;
    }else{$("err").textContent="Database belum dipilih di config.js.";return}
  }catch(e){$("err").textContent="Gagal masuk. Periksa email, kata sandi, dan pengaturan di config.js.";return}
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}$("pw").value="";$("login").hidden=true;$("app").hidden=false;load();clearInterval(tm);tm=setInterval(load,15000);
}
function logout(){tok=null;seen=null;orders=[];clearInterval(tm);$("app").hidden=true;$("login").hidden=false}

async function load(){
  try{
    if(C.backend==="supabase"){
      const r=await fetch(C.supabase.url+"/rest/v1/orders?select=*&order=created_at.desc&limit=200",{headers:{apikey:C.supabase.anonKey,Authorization:"Bearer "+tok}});
      if(r.status===401||r.status===403){logout();$("err").textContent="Sesi habis atau akun bukan admin.";return}
      orders=(await r.json()).map(o=>norm({...o,_id:o.id,_t:o.created_at}));
    }else{
      const r=await fetch(FS+":runQuery",{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({structuredQuery:{from:[{collectionId:"orders"}],orderBy:[{field:{fieldPath:"createdAt"},direction:"DESCENDING"}],limit:200}})});
      if(r.status===401||r.status===403){logout();$("err").textContent="Sesi habis atau akun bukan admin.";return}
      orders=(await r.json()).filter(x=>x.document).map(x=>norm({...fv(x.document.fields),_id:x.document.name,_t:x.document.fields.createdAt?x.document.fields.createdAt.timestampValue:x.document.createTime}));
    }
    const ids=new Set(orders.map(o=>o._id));if(seen){const fresh=orders.filter(o=>!seen.has(o._id)&&o.status==="baru");if(fresh.length)notify(fresh)}seen=ids;
    draw();
  }catch(e){$("sum").textContent="Gagal memuat pesanan."}
}

function draw(){
  const nb=orders.filter(o=>o.status==="baru").length;
  $("sum").textContent=orders.length+" pesanan, "+nb+" baru";
  $("list").innerHTML=orders.length?orders.map((o,i)=>`<div class="c${o.status==="baru"?" n":""}"><div class="r"><b>${esc(o.no)}</b><span class="st">${esc(STL[o.status]||o.status)}</span></div>
  <div class="m">${esc(new Date(o._t).toLocaleString("id-ID"))} · ${esc(o.pay)} · ${esc(o.courier)}</div>
  <div style="margin:6px 0">${o.items.map(x=>esc(x.q)+" × "+esc(x.n)).join("<br>")}</div>
  <div><b>${rp(o.total)}</b> <span class="m">(ongkir ${o.fee?rp(o.fee):"gratis"})</span></div>
  <div class="m">${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.city)} ${esc(o.zip)}${o.note?"<br>Catatan: "+esc(o.note):""}</div>
  <div class="a">${Object.keys(STL).filter(s=>s!=="baru"&&s!==o.status).map(s=>`<button data-i="${i}" data-s="${s}" class="${s===NEXT[o.status]?"p":""}">${s==="batal"?"Batalkan":STL[s]}</button>`).join("")}</div></div>`).join(""):'<p class="m">Belum ada pesanan.</p>';
}

async function setStatus(i,st){
  const o=orders[i];if(!o)return;
  try{
    let r;
    if(C.backend==="supabase")r=await fetch(C.supabase.url+"/rest/v1/orders?id=eq."+encodeURIComponent(o._id),{method:"PATCH",headers:{apikey:C.supabase.anonKey,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({status:st})});
    else r=await fetch("https://firestore.googleapis.com/v1/"+o._id+"?updateMask.fieldPaths=status",{method:"PATCH",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({fields:{status:{stringValue:st}}})});
    if(!r.ok)throw 0;o.status=st;draw();
  }catch(e){alert("Gagal mengubah status.")}
}

$("go").onclick=login;$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("nt").onclick=async()=>{try{const p=await Notification.requestPermission();$("nt").textContent=p==="granted"?"Notifikasi aktif":"Notifikasi ditolak"}catch(e){$("nt").textContent="Tidak didukung di sini"}beep()};
$("rf").onclick=load;$("lo").onclick=logout;
$("list").onclick=e=>{const b=e.target.closest("button");if(b)setStatus(+b.dataset.i,b.dataset.s)};
</script>
</body>
</html>
